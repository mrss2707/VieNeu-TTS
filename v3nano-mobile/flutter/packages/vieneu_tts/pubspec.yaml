name: vieneu_tts
description: Flutter bridge cho VieNeu-TTS v3 Nano Mobile SDK (thin wrapper — không port engine).
version: 0.1.0-dev.1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.vieneu.mobile.flutter
        pluginClass: VieNeuTtsPlugin
      ios:
        pluginClass: VieNeuTtsPlugin
